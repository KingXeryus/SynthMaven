name: SynthMaven build and website
on:
  push:
    branches: [main, synthmaven-korg-ble, usb-midi-performance, oriental-factory-bank, fm1-control-fixes]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: synthmaven-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install Pillow Markdown==3.7
      - name: Host UI, routing, settings and editor tests
        env:
          SM_SKIP_FULL_WEB: ${{ github.ref == 'refs/heads/main' && '0' || '1' }}
        run: sh tools/test_synthmaven.sh
      - name: Build development website
        run: python3 tools/make_synthmaven_site.py
      - name: Download target toolchain and SDK
        id: deps
        continue-on-error: true
        run: |
          sh tools/get_toolchain.sh "$RUNNER_TEMP/jieli"
          for attempt in 1 2 3; do
            if timeout 180 git -c http.lowSpeedLimit=1024 -c http.lowSpeedTime=45 clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$RUNNER_TEMP/ac79"; then break; fi
            rm -rf "$RUNNER_TEMP/ac79"
          done
          test -d "$RUNNER_TEMP/ac79/.git"
      - name: Build actual SynthMaven firmware
        id: target
        if: steps.deps.outcome == 'success'
        continue-on-error: true
        run: |
          SYNTHMAVEN_BLE=1 JIELI_TOOLCHAIN="$RUNNER_TEMP/jieli/toolchain" AC79_SDK="$RUNNER_TEMP/ac79" sh build.sh --release 1.3
          python3 tools/make_synthmaven_site.py --package build/felucca-1.3.fwsc
      - name: Report target build status
        run: |
          if [ ! -f build/felucca-1.3.fwsc ]; then
            echo 'Target firmware not built; deployment is blocked.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: SynthMaven-development-build
          path: |
            build/*.fwsc
            build/*.elf
            build/*.dis
            build/synthmaven-site/source/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/synthmaven-site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
