name: SynthMaven build and website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: synthmaven-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install Pillow
      - name: Host UI, routing, settings and editor tests
        run: sh tools/test_synthmaven.sh
      - name: Build development website
        run: python3 tools/make_synthmaven_site.py
      - name: Download target toolchain and SDK
        id: deps
        continue-on-error: true
        run: |
          sh tools/get_toolchain.sh "$RUNNER_TEMP/jieli"
          git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$RUNNER_TEMP/ac79"
      - name: Build actual SynthMaven firmware
        id: target
        if: steps.deps.outcome == 'success'
        continue-on-error: true
        run: |
          JIELI_TOOLCHAIN="$RUNNER_TEMP/jieli/toolchain" AC79_SDK="$RUNNER_TEMP/ac79" sh build.sh
          python3 tools/make_synthmaven_site.py --package build/felucca.fwsc
      - name: Report target build status
        run: |
          if [ ! -f build/felucca.fwsc ]; then
            echo 'Target firmware not built; published installer stays disabled.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: SynthMaven-development-build
          path: |
            build/*.fwsc
            build/synthmaven-site/source/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/synthmaven-site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
