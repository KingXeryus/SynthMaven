name: SynthMaven build and website
on:
  push:
    branches: [main, synthmaven-korg-ble, usb-midi-performance, oriental-factory-bank, fm1-control-fixes, vital-preset-import, release-2.1]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: synthmaven-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install Pillow Markdown==3.7 numpy scipy
      - name: Host UI, routing, settings and editor tests
        env:
          SM_SKIP_FULL_WEB: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release-2.1') && '0' || '1' }}
        run: sh tools/test_synthmaven.sh
      - name: Audit all 557 factory entries
        run: sh tools/audit_factory_levels.sh
      - name: Build development website
        run: python3 tools/make_synthmaven_site.py
      - name: Download target toolchain and SDK
        id: deps
        run: |
          sh tools/get_toolchain.sh "$RUNNER_TEMP/jieli"
          for attempt in 1 2 3; do
            if timeout 180 git -c http.lowSpeedLimit=1024 -c http.lowSpeedTime=45 clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$RUNNER_TEMP/ac79"; then break; fi
            rm -rf "$RUNNER_TEMP/ac79"
          done
          test -d "$RUNNER_TEMP/ac79/.git"
      - name: Build actual SynthMaven firmware
        id: target
        if: steps.deps.outcome == 'success'
        run: |
          JIELI_TOOLCHAIN="$RUNNER_TEMP/jieli/toolchain" AC79_SDK="$RUNNER_TEMP/ac79" sh build.sh --release "$(python3 -c 'import json; print(json.load(open("release.json"))["version"])')"
          python3 tools/make_synthmaven_site.py --package "build/felucca-$(python3 -c 'import json; print(json.load(open("release.json"))["version"])').fwsc"
      - name: Report target build status
        run: |
          if [ ! -f build/felucca-$(python3 -c 'import json; print(json.load(open("release.json"))["version"])').fwsc ]; then
            echo 'Target firmware not built; deployment is blocked.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: SynthMaven-development-build
          path: |
            build/*.fwsc
            build/*.elf
            build/*.dis
            build/synthmaven-site/source/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/synthmaven-site
  publish_release:
    if: github.ref == 'refs/heads/release-2.1'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SynthMaven-development-build
          path: release-artifact
      - name: Package release assets and checksums
        run: |
          mkdir -p release-files
          cp release-artifact/felucca-2.1.fwsc release-files/synthmaven-2.1.fwsc
          cp release-artifact/synthmaven-site/source/SynthMaven-source.zip release-files/SynthMaven-2.1-source.zip
          cp docs/release-2.1.md release-files/RELEASE-NOTES.md
          cp docs/USER_MANUAL.md release-files/USER-MANUAL.md
          cp QUICKSTART.md release-files/INSTALL-AND-RECOVERY.md
          cd release-files
          sha256sum *.fwsc *.zip *.md > SHA256SUMS.txt
      - name: Publish version 2.1 without replacing an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release v2.1 already exists; refusing to replace immutable assets.'
            exit 1
          fi
          gh release create v2.1 release-files/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "SynthMaven 2.1" --notes-file docs/release-2.1.md --latest
  deploy:
    if: always() && needs.build.result == 'success' && (github.ref == 'refs/heads/main' || (github.ref == 'refs/heads/release-2.1' && needs.publish_release.result == 'success'))
    needs: [build, publish_release]
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
